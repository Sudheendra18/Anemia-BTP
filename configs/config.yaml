dataset:
  name: "CP-AnemiC"

  # Class folder names must match the directories on disk.
  raw_images_dir: "data/raw"
  class_folders:
    anemic: "Anemic"
    non_anemic: "Non-anemic"

  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]

  metadata_excel_path: "data/Anemia_Data_Collection_Sheet.xlsx"
  metadata_sheet_name: "Anemia_Data_Collection_Sheet"

  excel_columns:
    image_id: "IMAGE_ID"
    hb_level: "HB_LEVEL"
    severity: "Severity"
    age_months: "Age(Months)"
    gender: "GENDER"
    remark: "REMARK"
    hospital: "HOSPITAL"
    city_town: "CITY/TOWN"
    district: "MUNICIPALITY/DISTRICT"
    region: "REGION"
    country: "COUNTRY"

  label_map:
    "Non-anemic": 0
    "Anemic": 1

metadata_builder:
  output_csv: "outputs/metadata/cp_anemic_metadata.csv"
  # Label conflicts and missing Excel matches are recorded here.
  issues_csv: "outputs/metadata/cp_anemic_issues.csv"
  # When false, unresolved conflicts keep the folder label and are flagged.
  drop_conflicts: false

roi_extraction:
  output_dir: "outputs/roi"
  output_csv: "outputs/metadata/cp_anemic_metadata_with_roi.csv"
  debug_dir: "outputs/debug"
  debug_sample_size: 20

  # Set to null to disable downscaling.
  resize_long_side: 800

  min_contour_area_frac: 0.03

  fallback_center_crop_frac: 0.6

training:
  # Use with_roi for crops or raw for full images.
  image_source: "with_roi"

  architecture: "efficientnet_b0"  # resnet50 or efficientnet_b0
  pretrained: true
  freeze_backbone: false

  num_classes: 2
  image_size: 224
  batch_size: 8
  num_epochs: 40
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adam"  # adam or sgd

  # Supported schedules are none, cosine, and plateau.
  lr_scheduler: "cosine"

  use_class_weights: true

  augmentation:
    rotation_degrees: 15
    color_jitter: 0.2
    random_erasing_prob: 0.0

  num_workers: 0
  early_stopping_patience: 10

  # Mixed precision is enabled only on CUDA.
  mixed_precision: true

  # Cross-validation groups images by patient ID.
  k_folds: 5

  primary_metric: "f2"  # f2, f1, auc, accuracy, or sensitivity

  output_dir: "outputs/training"

# Each experiment inherits training settings and applies its overrides.
experiments:
  output_dir: "outputs/experiments"
  runs:
    - name: "resnet50_lr1e-4"
      overrides:
        architecture: "resnet50"
        learning_rate: 0.0001
    - name: "resnet50_lr3e-5"
      overrides:
        architecture: "resnet50"
        learning_rate: 0.00003
    - name: "efficientnet_b0_lr1e-4"
      overrides:
        architecture: "efficientnet_b0"
        learning_rate: 0.0001
    - name: "efficientnet_b0_lr3e-4"
      overrides:
        architecture: "efficientnet_b0"
        learning_rate: 0.0003
    - name: "efficientnet_b0_lr1e-4_wd5e-4"
      overrides:
        architecture: "efficientnet_b0"
        learning_rate: 0.0001
        weight_decay: 0.0005
    - name: "efficientnet_b0_lr1e-4_wd5e-4_aug"
      overrides:
        architecture: "efficientnet_b0"
        learning_rate: 0.0001
        weight_decay: 0.0005
        augmentation:
          rotation_degrees: 20
          color_jitter: 0.3
          random_erasing_prob: 0.25

ablation:
  output_dir: "outputs/no_augmentation"

random_seed: 42

# Tune capture quality thresholds for the target devices.
capture:
  inference:
    enabled: true
    model_dir: "outputs/experiments/efficientnet_b0_lr1e-4"
    threshold: 0.5  # Research cutoff without clinical validation.
    legacy_input_format: rectangular  # Used for older checkpoints without an input contract.
    require_roi_confirmation: true
  output_dir: "outputs/captures"
  analysis_width: 640  # Saved frames retain source resolution.
  stride: 2
  detect_interval: 5
  min_sharpness: 35.0
  brightness_min: 55.0
  brightness_max: 205.0
  max_glare: 0.04
  max_clipped: 0.15

